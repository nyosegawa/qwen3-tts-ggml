name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos-metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF
          cmake --build build --config Release -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-macos-arm64-metal
          path: |
            build/qwen3-tts
            build/qwen3-tts-worker
            build/codec-check
            build/talker-check
            build/tokenizer-check

  windows-vulkan:
    runs-on: windows-2025
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install the Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - name: Build
        run: |
          cmake -B build -A x64 -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-windows-x64-vulkan
          path: |
            build/Release/qwen3-tts.exe
            build/Release/qwen3-tts-worker.exe
            build/Release/codec-check.exe
            build/Release/talker-check.exe
            build/Release/tokenizer-check.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-metal, windows-vulkan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          # Artifacts lose the executable bit; the Mac binaries need it back.
          (cd qwen3-tts-macos-arm64-metal && chmod +x * && zip -q "../qwen3-tts-ggml-${GITHUB_REF_NAME}-macos-arm64-metal.zip" *)
          (cd qwen3-tts-windows-x64-vulkan && zip -q "../qwen3-tts-ggml-${GITHUB_REF_NAME}-windows-x64-vulkan.zip" *)
          sha256sum *.zip > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Binaries for macOS arm64 (Metal) and Windows x64 (Vulkan). The models are on https://huggingface.co/sakasegawa/qwen3-tts-ggml."
