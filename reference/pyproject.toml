[project]
name = "qwen3-tts-ggml-reference"
version = "0"
description = "Runs the official Qwen3-TTS to dump reference tensors, and converts its weights to GGUF"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qwen-tts @ git+https://github.com/QwenLM/Qwen3-TTS@022e286",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "numpy",
  "safetensors",
  "gguf",
]

[tool.uv]
package = false
